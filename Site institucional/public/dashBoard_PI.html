<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/dashBoard_PI.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body onload="buscarAvaliacoes(); contarAvaliacao(); contarZona()"">

    <div class=" container">

    <div class="menu">
        <h1 class="titulo-mudanca">Gestão de Mudanças</h1>
        <a class="botao-dash" href="dashBoard_PI.html">Dashboard</a>
    </div>

    <div class="conteudo">

        <div class="cabecalho">
            <h1 class="titulo-Dashboard">Dashboard</h1>
        </div>

        <div class="container-kpis">
            <div class="kpi-total-avaliacoes">
                <h3>Avaliações registradas</h3>
                <h1 id="totalAvaliacoes">0</h1>
            </div>

            <div class="kpi-total-avaliacoes">
                <h3>Zona mais avaliada</h3>
                <h1 id="totalZona">0</h1>
            </div>
        </div>
        <div class="grafico-dash">
            <canvas id="grafico-barras"></canvas>
        </div>

    </div>
 

    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
</body>

</html>
<script>

    function buscarAvaliacoes() {
        fetch("/quiz/listar")
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {
                console.log(dados);

                let bairros = [];
                let medias = [];

                for (let i = 0; i < dados.length; i++) {
                    bairros.push(dados[i].bairro);
                    medias.push(Number(dados[i].Media));
                }

                new Chart(
                    document.getElementById('grafico-barras'),
                    {
                        type: 'bar',
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            plugins: {
                                legend: {
                                    display: true
                                },
                                tooltip: {
                                    enabled: true
                                }
                            }
                        },
                        data: {
                            labels: bairros,
                            datasets: [
                                {
                                    label: 'Média das avaliações dos bairros',
                                    data: medias,
                                    backgroundColor: '#FFCC00',
                                    borderRadius: 6,
                                    maxBarThickness: 90,
                                }
                            ]
                        }
                    }
                )

                console.log(bairros);
                console.log(medias);
            })
            .catch(function (erro) {
                console.log("ERRO NA DASHBOARD:", erro);
            });
    }
    function contarAvaliacao() {
        fetch("/quiz/contarAvaliacao")
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {
                console.log(dados);
                document.getElementById("totalAvaliacoes").innerHTML = dados[0].TotalAvaliacoes;
            })
    };

    function contarZona() {
        fetch("/quiz/contarZona")
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (dados) {
                console.log(dados);
                document.getElementById("totalZona").innerHTML = dados[0].zona + " <br> " + dados[0].TotalZona + '<span style="color: #FFCC00;"> avaliações </span>';
            })
    };

</script>
